<style>
:root{--primary:#1e3a5f;--secondary:#4ea5d9;--bg:#f4f7fb;--text:#1e293b}
body{font-family:'Poppins',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.navbar{background:var(--primary)!important}.navbar-brand{font-weight:700;letter-spacing:1px}
.nav-link{font-weight:500}.nav-link:hover{color:#8fd0f5!important}
.page-hero{background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;padding:55px 0}
.content-card{background:white;border:0;border-radius:14px;box-shadow:0 6px 18px rgba(30,58,95,.10)}
.btn-jd{background:var(--primary);color:#fff;border:0}.btn-jd:hover{background:var(--secondary);color:#fff}
.result-box{background:#eef7fc;border-left:5px solid var(--secondary);border-radius:10px;padding:18px;min-height:70px}
footer{background:var(--primary);color:#fff;margin-top:50px}
footer a{color:#fff;text-decoration:none}footer a:hover{color:#8fd0f5}
input,select{border-radius:8px!important}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
<div class="container">
<a class="navbar-brand" href="index.html">JD WebWorks</a>

</ul></div></div></nav>

<section class="page-hero"><div class="container"><h1 class="fw-bold">Weather API</h1><p class="lead mb-0">Check current weather information for a city.</p></div></section>
<main class="container py-5"><div class="content-card p-4 mx-auto" style="max-width:700px">
<label for="city" class="form-label fw-semibold">Enter city name:</label>
<div class="input-group"><input type="text" id="city" class="form-control" placeholder="e.g. Manila"><button onclick="getWeather()" class="btn btn-jd">Get Weather</button></div>
<div id="weatherResult" class="result-box mt-4">Weather results will appear here.</div>
</div></main>
<footer class="py-4">
<div class="container text-center">
<p class="mb-1">&copy; 2026 JD WebWorks | Burce Joevan Dave | BSIS 2A</p>
<small>Web Systems and Technologies Laboratory</small>
</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function getWeather(){
let city=document.getElementById("city").value.trim();
if(!city){document.getElementById("weatherResult").innerText="Please enter a city name.";return;}
let apiKey="20222aa8075cb3b21c722be549aad4a4";
let url=`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;
document.getElementById("weatherResult").innerText="Loading weather...";
fetch(url).then(response=>response.json()).then(data=>{
if(data.cod && data.cod !== 200){document.getElementById("weatherResult").innerText=data.message||"Unable to get weather data.";return;}
document.getElementById("weatherResult").innerHTML=`<h3 class="h5 fw-bold">${data.name}</h3><p class="mb-1">Temperature: ${data.main.temp}°C</p><img src="https://openweathermap.org/img/w/${data.weather[0].icon}.png" alt="Weather icon"><p class="mb-0 text-capitalize">${data.weather[0].description}</p>`;
}).catch(error=>{console.error(error);document.getElementById("weatherResult").innerText="Unable to fetch weather data.";});}
</script></body></html>

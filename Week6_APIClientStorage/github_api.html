<style>
:root{--primary:#1e3a5f;--secondary:#4ea5d9;--bg:#f4f7fb;--text:#1e293b}
body{font-family:'Poppins',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.navbar{background:var(--primary)!important}.navbar-brand{font-weight:700;letter-spacing:1px}
.nav-link{font-weight:500}.nav-link:hover{color:#8fd0f5!important}
.page-hero{background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;padding:55px 0}
.content-card{background:white;border:0;border-radius:14px;box-shadow:0 6px 18px rgba(30,58,95,.10)}
.btn-jd{background:var(--primary);color:#fff;border:0}.btn-jd:hover{background:var(--secondary);color:#fff}
.result-box{background:#eef7fc;border-left:5px solid var(--secondary);border-radius:10px;padding:18px;min-height:70px}
footer{background:var(--primary);color:#fff;margin-top:50px}
footer a{color:#fff;text-decoration:none}footer a:hover{color:#8fd0f5}
input,select{border-radius:8px!important}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
<div class="container">
<a class="navbar-brand" href="index.html">JD WebWorks</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation">
<span class="navbar-toggler-icon"></span>
</button>

<ul class="navbar-nav ms-auto">

</ul></div></div></nav>

<section class="page-hero"><div class="container"><h1 class="fw-bold">GitHub API</h1><p class="lead mb-0">Look up public information for a GitHub user.</p></div></section>
<main class="container py-5"><div class="content-card p-4 mx-auto" style="max-width:700px">
<label for="username" class="form-label fw-semibold">GitHub Username</label>
<div class="input-group"><input type="text" id="username" class="form-control" placeholder="Enter GitHub username"><button onclick="getUser()" class="btn btn-jd">Get User</button></div>
<div id="userResult" class="result-box mt-4">Profile results will appear here.</div></div></main>
<footer class="py-4">
<div class="container text-center">
<p class="mb-1">&copy; 2026 JD WebWorks | Burce Joevan Dave | BSIS 2A</p>
<small>Web Systems and Technologies Laboratory</small>
</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function getUser(){
let username=document.getElementById("username").value.trim();
if(!username){document.getElementById("userResult").innerText="Please enter a GitHub username.";return;}
let url=`https://api.github.com/users/${encodeURIComponent(username)}`;
document.getElementById("userResult").innerText="Loading profile...";
fetch(url).then(response=>response.json()).then(data=>{
if(data.message==="Not Found"){document.getElementById("userResult").innerText="GitHub user not found.";return;}
document.getElementById("userResult").innerHTML=`<div class="text-center"><img src="${data.avatar_url}" width="110" height="110" class="rounded-circle mb-3" alt="GitHub avatar"><h3 class="h5 fw-bold">${data.name||"No Name Found"}</h3><p class="mb-1">Public Repos: ${data.public_repos}</p><p class="mb-0">Followers: ${data.followers}</p></div>`;
}).catch(error=>{console.error(error);document.getElementById("userResult").innerText="Error fetching GitHub data.";});}
</script></body></html>
